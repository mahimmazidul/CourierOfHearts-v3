<!doctype html>
<!--
  Served for /letter/* paths (nginx rewrite + GitHub Pages 404 shim).
  Crawlers and social apps that never execute JavaScript receive exactly this
  generic metadata through a real HTTP response — nothing about the letter,
  its sender, recipient, or contents ever appears here. Browsers are handed to
  the SPA immediately.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A private letter awaits you 💌 — Courier of Hearts</title>
    <meta name="description" content="Someone left something special for you on CourierOfHearts." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Courier of Hearts" />
    <meta property="og:title" content="A private letter awaits you 💌" />
    <meta property="og:description" content="Someone left something special for you on CourierOfHearts." />
    <meta property="og:image" content="/images/envelope.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="A private letter awaits you 💌" />
    <meta name="twitter:description" content="Someone left something special for you on CourierOfHearts." />
    <script>
      // Hand the browser to the SPA, preserving the letter path as a hash
      // route (works for /letter/<slug> on the domain and on GitHub Pages).
      (function () {
        var path = window.location.pathname;
        var match = path.match(/\/(letter\/[A-Za-z0-9_-]+)\/?$/);
        var base = path.replace(/\/(letter\/[A-Za-z0-9_-]+)\/?$/, '/') || '/';
        window.location.replace(base + (match ? '#/' + match[1] : ''));
      })();
    </script>
  </head>
  <body>
    <p style="font-family: Georgia, serif; text-align: center; margin-top: 4rem; color: #3d3020;">
      A private letter awaits you 💌 — <a href="/">open Courier of Hearts</a>
    </p>
  </body>
</html>
